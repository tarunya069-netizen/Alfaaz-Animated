function update(i){if(i===idx)return;idx=i;words.classList.add('out');setTimeout(()=>{line.textContent=captions[i][0];sub.textContent=captions[i][1];words.classList.remove('out')},170)}function fmt(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(Math.floor(n%60)).padStart(2,'0')}function frame(now){if(playing){if(Number.isFinite(audio.duration)&&audio.duration>0)t=Math.min(total,audio.currentTime);else t+=Math.min(.1,(now-last)/1000);if(t>=total){t=total;playing=false;audio.pause()}}last=now;let i=Math.min(11,Math.floor(t/4));update(i);draw(i,t%4/4);document.getElementById('progress').style.width=t/total*100+'%';document.getElementById('seek').value=t/total*1000;document.getElementById('clock').textContent=fmt(t)+' / '+fmt(total);document.getElementById('step').textContent=String(i+1).padStart(2,'0')+' / 12';pause.textContent=playing?'Ⅱ':'▶';requestAnimationFrame(frame)}requestAnimationFrame(frame);async function toggle(){if(playing){playing=false;audio.pause();return}if(t>=total){t=0;audio.currentTime=0}audio.muted=false;audio.volume=1;try{await audio.play();playing=true;status.textContent='Music playing';document.getElementById('start').classList.add('hide')}catch(err){playing=false;status.textContent='Audio could not start. Please tap Start again.';document.getElementById('start').classList.remove('hide');console.error('Audio playback failed:',err)}}pause.onclick=toggle;document.getElementById('begin').onclick=toggle;document.getElementById('seek').oninput=e=>{t=total*Number(e.target.value)/1000;audio.currentTime=t};audio.addEventListener('loadedmetadata',()=>{hasMusic=true;status.textContent='Song ready — tap Start Experience'});audio.addEventListener('canplay',()=>{hasMusic=true});audio.addEventListener('error',()=>{hasMusic=false;status.textContent='Song could not load. Please refresh and try again.'});document.getElementById('music').onclick=()=>{audio.muted=!audio.muted;document.getElementById('music').textContent=audio.muted?'♫ Muted':'♫ Sound
